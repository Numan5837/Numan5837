<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="333" viewBox="0 0 1200 333" role="img"><title>Expertise: mathematics, ML research, operations, data engineering, agent systems, verifier engineering</title><defs>
<linearGradient id="ink"><stop stop-color="#fbfcff"/><stop offset=".52" stop-color="#bbc5ff"/><stop offset="1" stop-color="#79edee"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6aeef3"/><stop offset=".48" stop-color="#8b8dff"/><stop offset="1" stop-color="#d999ff"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#6044ce" stop-opacity=".38"/><stop offset="1" stop-color="#6044ce" stop-opacity="0"/></radialGradient>
<radialGradient id="cyanAura"><stop stop-color="#137f97" stop-opacity=".28"/><stop offset="1" stop-color="#137f97" stop-opacity="0"/></radialGradient>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171e35"/><stop offset="1" stop-color="#0d1221"/></linearGradient>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter>
<pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#99a9f0" opacity=".11"/></pattern>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#f1f5ff}
.mono{font-family:Consolas,'DejaVu Sans Mono',monospace}
.muted{fill:#9faec9}.cyan{fill:#62edee}.purple{fill:#a98aff}.lime{fill:#c5f784}
.dash{stroke-dasharray:5 10;animation:dash 24s linear infinite}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-180}}
@keyframes breathe{50%{opacity:.38}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x="1" y="1" width="394" height="160" rx="14" fill="url(#surface)" stroke="#27324b" /><text x="23" y="32" font-size="13" class="mono" style="fill:#62edee">01</text><text x="23" y="72" font-size="27" class="" font-weight="650">Mathematics</text><text x="23" y="106" font-size="17" class="muted" >Proofs. Numerical reasoning.</text><text x="23" y="132" font-size="17" class="muted" >Exact, checkable certificates.</text><path d="M341 25h24m-12 -12v24" stroke="#62edee" stroke-opacity=".6"/><rect x="403" y="1" width="394" height="160" rx="14" fill="url(#surface)" stroke="#27324b" /><text x="425" y="32" font-size="13" class="mono" style="fill:#a98aff">02</text><text x="425" y="72" font-size="27" class="" font-weight="650">ML research</text><text x="425" y="106" font-size="17" class="muted" >Reproducible experiments.</text><text x="425" y="132" font-size="17" class="muted" >Model and trajectory analysis.</text><path d="M743 25h24m-12 -12v24" stroke="#a98aff" stroke-opacity=".6"/><rect x="805" y="1" width="394" height="160" rx="14" fill="url(#surface)" stroke="#27324b" /><text x="827" y="32" font-size="13" class="mono" style="fill:#c5f784">03</text><text x="827" y="72" font-size="27" class="" font-weight="650">Operations</text><text x="827" y="106" font-size="17" class="muted" >Planning under constraints.</text><text x="827" y="132" font-size="17" class="muted" >Backlogs, staffing, allocation.</text><path d="M1145 25h24m-12 -12v24" stroke="#c5f784" stroke-opacity=".6"/><rect x="1" y="172" width="394" height="160" rx="14" fill="url(#surface)" stroke="#27324b" /><text x="23" y="203" font-size="13" class="mono" style="fill:#62edee">04</text><text x="23" y="243" font-size="27" class="" font-weight="650">Data engineering</text><text x="23" y="277" font-size="17" class="muted" >Reliable data and databases.</text><text x="23" y="303" font-size="17" class="muted" >Consistency &amp; reconciliation.</text><path d="M341 196h24m-12 -12v24" stroke="#62edee" stroke-opacity=".6"/><rect x="403" y="172" width="394" height="160" rx="14" fill="url(#surface)" stroke="#27324b" /><text x="425" y="203" font-size="13" class="mono" style="fill:#a98aff">05</text><text x="425" y="243" font-size="27" class="" font-weight="650">Agent systems</text><text x="425" y="277" font-size="17" class="muted" >Terminal execution &amp; tooling.</text><text x="425" y="303" font-size="17" class="muted" >Isolation and container runtimes.</text><path d="M743 196h24m-12 -12v24" stroke="#a98aff" stroke-opacity=".6"/><rect x="805" y="172" width="394" height="160" rx="14" fill="url(#surface)" stroke="#27324b" /><text x="827" y="203" font-size="13" class="mono" style="fill:#c5f784">06</text><text x="827" y="243" font-size="27" class="" font-weight="650">Verifier engineering</text><text x="827" y="277" font-size="17" class="muted" >Oracle, no-op, mutation checks.</text><text x="827" y="303" font-size="17" class="muted" >Defensible scores and evidence.</text><path d="M1145 196h24m-12 -12v24" stroke="#c5f784" stroke-opacity=".6"/></svg>