<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="552" viewBox="0 0 1200 552" role="img"><title>Animated verifier graph: task package, isolated sandbox, agent execution, exact checks, rubric judge, adversarial controls, evidence report, and failure analysis loop. Illustrative workflow.</title><defs>
<linearGradient id="ink"><stop stop-color="#fbfcff"/><stop offset=".52" stop-color="#bbc5ff"/><stop offset="1" stop-color="#79edee"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6aeef3"/><stop offset=".48" stop-color="#8b8dff"/><stop offset="1" stop-color="#d999ff"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#6044ce" stop-opacity=".38"/><stop offset="1" stop-color="#6044ce" stop-opacity="0"/></radialGradient>
<radialGradient id="cyanAura"><stop stop-color="#137f97" stop-opacity=".28"/><stop offset="1" stop-color="#137f97" stop-opacity="0"/></radialGradient>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171e35"/><stop offset="1" stop-color="#0d1221"/></linearGradient>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter>
<pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#99a9f0" opacity=".11"/></pattern>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#f1f5ff}
.mono{font-family:Consolas,'DejaVu Sans Mono',monospace}
.muted{fill:#9faec9}.cyan{fill:#62edee}.purple{fill:#a98aff}.lime{fill:#c5f784}
.dash{stroke-dasharray:5 10;animation:dash 24s linear infinite}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-180}}
@keyframes breathe{50%{opacity:.38}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x="1" y="1" width="1198" height="550" rx="20" fill="#080b16" stroke="#27324b" /><ellipse cx="590" cy="250" rx="560" ry="230" fill="url(#aura)" opacity=".6"/><text x="32" y="39" font-size="14" class="mono cyan" letter-spacing="1">VERIFIER LAB / EXECUTION GRAPH</text><text x="32" y="83" font-size="34" class="" font-weight="650">A score is only as good as its verifier.</text><text x="32" y="113" font-size="18" class="muted" >An animated view of the checks behind a trustworthy evaluation.</text><path d="M230 263H284" fill="none" stroke="#62edee" stroke-opacity=".35" stroke-width="2"/><circle r="4" fill="#62edee"><animateMotion path="M230 263H284" dur="3.2s" begin="0.0s" repeatCount="indefinite"/></circle><path d="M490 263H544" fill="none" stroke="#62edee" stroke-opacity=".35" stroke-width="2"/><circle r="4" fill="#62edee"><animateMotion path="M490 263H544" dur="3.2s" begin="0.37s" repeatCount="indefinite"/></circle><path d="M750 263C786 263 773 186 807 186" fill="none" stroke="#62edee" stroke-opacity=".35" stroke-width="2"/><circle r="4" fill="#62edee"><animateMotion path="M750 263C786 263 773 186 807 186" dur="3.2s" begin="0.74s" repeatCount="indefinite"/></circle><path d="M750 263H807" fill="none" stroke="#a98aff" stroke-opacity=".35" stroke-width="2"/><circle r="4" fill="#a98aff"><animateMotion path="M750 263H807" dur="3.2s" begin="1.1099999999999999s" repeatCount="indefinite"/></circle><path d="M750 263C786 263 773 340 807 340" fill="none" stroke="#c5f784" stroke-opacity=".35" stroke-width="2"/><circle r="4" fill="#c5f784"><animateMotion path="M750 263C786 263 773 340 807 340" dur="3.2s" begin="1.48s" repeatCount="indefinite"/></circle><path d="M1011 186C1052 186 1050 263 1080 263" fill="none" stroke="#62edee" stroke-opacity=".35" stroke-width="2"/><circle r="4" fill="#62edee"><animateMotion path="M1011 186C1052 186 1050 263 1080 263" dur="3.2s" begin="1.85s" repeatCount="indefinite"/></circle><path d="M1011 263H1080" fill="none" stroke="#a98aff" stroke-opacity=".35" stroke-width="2"/><circle r="4" fill="#a98aff"><animateMotion path="M1011 263H1080" dur="3.2s" begin="2.2199999999999998s" repeatCount="indefinite"/></circle><path d="M1011 340C1052 340 1050 263 1080 263" fill="none" stroke="#c5f784" stroke-opacity=".35" stroke-width="2"/><circle r="4" fill="#c5f784"><animateMotion path="M1011 340C1052 340 1050 263 1080 263" dur="3.2s" begin="2.59s" repeatCount="indefinite"/></circle><rect x="28" y="221" width="202" height="84" rx="12" fill="url(#surface)" stroke="#27324b" /><circle cx="45" cy="245" r="3" fill="#62edee"/><text x="58" y="251" font-size="17" class="mono" font-weight="700">TASK PACKAGE</text><text x="45" y="279" font-size="14" class="muted" >spec + fixtures + oracle</text><rect x="284" y="221" width="206" height="84" rx="12" fill="url(#surface)" stroke="#27324b" /><circle cx="301" cy="245" r="3" fill="#62edee"/><text x="314" y="251" font-size="17" class="mono" font-weight="700">SANDBOX</text><text x="301" y="279" font-size="14" class="muted" >Docker / isolated state</text><rect x="544" y="221" width="206" height="84" rx="12" fill="url(#surface)" stroke="#27324b" /><circle cx="561" cy="245" r="3" fill="#62edee"/><text x="574" y="251" font-size="17" class="mono" font-weight="700">AGENT RUN</text><text x="561" y="279" font-size="14" class="muted" >commands + artifacts</text><rect x="807" y="150" width="204" height="72" rx="12" fill="url(#surface)" stroke="#27324b" /><circle cx="824" cy="174" r="3" fill="#62edee"/><text x="837" y="180" font-size="17" class="mono" font-weight="700">EXACT CHECK</text><text x="824" y="208" font-size="14" class="muted" >verifier-owned truth</text><rect x="807" y="227" width="204" height="72" rx="12" fill="url(#surface)" stroke="#27324b" /><circle cx="824" cy="251" r="3" fill="#a98aff"/><text x="837" y="257" font-size="17" class="mono" font-weight="700">RUBRIC JUDGE</text><text x="824" y="285" font-size="14" class="muted" >criterion + evidence</text><rect x="807" y="304" width="204" height="72" rx="12" fill="url(#surface)" stroke="#27324b" /><circle cx="824" cy="328" r="3" fill="#c5f784"/><text x="837" y="334" font-size="17" class="mono" font-weight="700">ADVERSARIAL</text><text x="824" y="362" font-size="14" class="muted" >no-op + mutation</text><rect x="1081" y="218" width="87" height="91" rx="12" fill="#132b32" stroke="#3c7982" /><text x="1092" y="250" font-size="26" class="cyan" >✓</text><text x="1092" y="278" font-size="12" class="mono cyan" >REPORT</text><path d="M644 306V405H128V306" fill="none" stroke="#65729e" stroke-dasharray="5 7" class="dash"/><text x="238" y="399" font-size="13" class="mono muted" >FAILURE ANALYSIS → REFINE → RE-RUN</text><rect x="28" y="440" width="1140" height="83" rx="10" fill="#0d1425" stroke="#27324b" /><text x="48" y="469" font-size="12" class="mono" style="fill:#62edee" letter-spacing="0.8">ORACLE</text><text x="48" y="495" font-size="16" class="" >must pass</text><text x="324" y="469" font-size="12" class="mono" style="fill:#a98aff" letter-spacing="0.8">NO-OP</text><text x="324" y="495" font-size="16" class="" >must fail</text><text x="600" y="469" font-size="12" class="mono" style="fill:#c5f784" letter-spacing="0.8">MUTATIONS</text><text x="600" y="495" font-size="16" class="" >probe shortcuts</text><text x="876" y="469" font-size="12" class="mono" style="fill:#9faec9" letter-spacing="0.8">INFRA ERRORS</text><text x="876" y="495" font-size="16" class="" >separate from model failures</text><text x="985" y="39" font-size="12" class="mono muted" >WORKFLOW DEMO</text></svg>