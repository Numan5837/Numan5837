<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1090" viewBox="0 0 720 1090" role="img"><title>Vertical animated verifier graph: task package, sandbox, agent run, parallel exact checks, rubric judging, adversarial controls, and an evidence report with feedback.</title><defs>
<linearGradient id="ink"><stop stop-color="#fbfcff"/><stop offset=".52" stop-color="#bbc5ff"/><stop offset="1" stop-color="#79edee"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6aeef3"/><stop offset=".48" stop-color="#8b8dff"/><stop offset="1" stop-color="#d999ff"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#6044ce" stop-opacity=".38"/><stop offset="1" stop-color="#6044ce" stop-opacity="0"/></radialGradient>
<radialGradient id="cyanAura"><stop stop-color="#137f97" stop-opacity=".28"/><stop offset="1" stop-color="#137f97" stop-opacity="0"/></radialGradient>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171e35"/><stop offset="1" stop-color="#0d1221"/></linearGradient>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter>
<pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#99a9f0" opacity=".11"/></pattern>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#f1f5ff}
.mono{font-family:Consolas,'DejaVu Sans Mono',monospace}
.muted{fill:#9faec9}.cyan{fill:#62edee}.purple{fill:#a98aff}.lime{fill:#c5f784}
.dash{stroke-dasharray:5 10;animation:dash 24s linear infinite}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-180}}
@keyframes breathe{50%{opacity:.38}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x="1" y="1" width="718" height="1088" rx="20" fill="#080b16" stroke="#27324b" /><text x="28" y="42" font-size="16" class="mono cyan" >VERIFIER LAB / WORKFLOW DEMO</text><text x="28" y="100" font-size="35" class="" font-weight="650">A score is only as good</text><text x="28" y="146" font-size="35" class="" font-weight="650">as its verifier.</text><rect x="132" y="190" width="456" height="96" rx="12" fill="url(#surface)" stroke="#27324b" /><circle cx="149" cy="214" r="3" fill="#62edee"/><text x="162" y="220" font-size="24" class="mono" font-weight="700">TASK PACKAGE</text><text x="149" y="248" font-size="20" class="muted" >spec + fixtures + oracle</text><path d="M360 286V338" stroke="#416c86" stroke-width="2"/><circle r="5" fill="#62edee"><animateMotion path="M360 286V338" dur="2s" begin="0.0s" repeatCount="indefinite"/></circle><rect x="132" y="338" width="456" height="96" rx="12" fill="url(#surface)" stroke="#27324b" /><circle cx="149" cy="362" r="3" fill="#62edee"/><text x="162" y="368" font-size="24" class="mono" font-weight="700">ISOLATED SANDBOX</text><text x="149" y="396" font-size="20" class="muted" >Docker / verifier-owned state</text><path d="M360 434V486" stroke="#416c86" stroke-width="2"/><circle r="5" fill="#62edee"><animateMotion path="M360 434V486" dur="2s" begin="0.3s" repeatCount="indefinite"/></circle><rect x="132" y="486" width="456" height="96" rx="12" fill="url(#surface)" stroke="#27324b" /><circle cx="149" cy="510" r="3" fill="#62edee"/><text x="162" y="516" font-size="24" class="mono" font-weight="700">AGENT EXECUTION</text><text x="149" y="544" font-size="20" class="muted" >commands + artifacts + trajectory</text><path d="M360 582C360 620 129 600 129 650" fill="none" stroke="#62edee" stroke-opacity=".45" stroke-width="2"/><circle r="5" fill="#62edee"><animateMotion path="M360 582C360 620 129 600 129 650" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle><rect x="24" y="650" width="212" height="85" rx="12" fill="url(#surface)" stroke="#27324b" /><circle cx="41" cy="674" r="3" fill="#62edee"/><text x="54" y="680" font-size="20" class="mono" font-weight="700">EXACT CHECK</text><text x="41" y="708" font-size="18" class="muted" >ground truth</text><path d="M129 735C129 795 360 770 360 814" fill="none" stroke="#62edee" stroke-opacity=".45" stroke-width="2"/><circle r="5" fill="#62edee"><animateMotion path="M129 735C129 795 360 770 360 814" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle><path d="M360 582C360 620 359 600 359 650" fill="none" stroke="#a98aff" stroke-opacity=".45" stroke-width="2"/><circle r="5" fill="#a98aff"><animateMotion path="M360 582C360 620 359 600 359 650" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle><rect x="254" y="650" width="212" height="85" rx="12" fill="url(#surface)" stroke="#27324b" /><circle cx="271" cy="674" r="3" fill="#a98aff"/><text x="284" y="680" font-size="20" class="mono" font-weight="700">RUBRIC JUDGE</text><text x="271" y="708" font-size="18" class="muted" >criteria</text><path d="M359 735C359 795 360 770 360 814" fill="none" stroke="#a98aff" stroke-opacity=".45" stroke-width="2"/><circle r="5" fill="#a98aff"><animateMotion path="M359 735C359 795 360 770 360 814" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle><path d="M360 582C360 620 589 600 589 650" fill="none" stroke="#c5f784" stroke-opacity=".45" stroke-width="2"/><circle r="5" fill="#c5f784"><animateMotion path="M360 582C360 620 589 600 589 650" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle><rect x="484" y="650" width="212" height="85" rx="12" fill="url(#surface)" stroke="#27324b" /><circle cx="501" cy="674" r="3" fill="#c5f784"/><text x="514" y="680" font-size="20" class="mono" font-weight="700">ADVERSARIAL</text><text x="501" y="708" font-size="18" class="muted" >controls</text><path d="M589 735C589 795 360 770 360 814" fill="none" stroke="#c5f784" stroke-opacity=".45" stroke-width="2"/><circle r="5" fill="#c5f784"><animateMotion path="M589 735C589 795 360 770 360 814" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle><rect x="132" y="815" width="456" height="96" rx="12" fill="url(#surface)" stroke="#27324b" /><circle cx="149" cy="839" r="3" fill="#c5f784"/><text x="162" y="845" font-size="24" class="mono" font-weight="700">EVIDENCE REPORT</text><text x="149" y="873" font-size="20" class="muted" >checkable scores + failure analysis</text><path d="M132 862H68V238H132" fill="none" stroke="#58678e" class="dash"/><text x="28" y="979" font-size="20" class="mono cyan" >ORACLE PASSES / NO-OP FAILS</text><text x="28" y="1018" font-size="18" class="mono muted" >MODEL FAILURE ≠ INFRASTRUCTURE FAILURE</text></svg>