<svg xmlns="http://www.w3.org/2000/svg" width="720" height="504" viewBox="0 0 720 504" role="img"><title>Mathematics, ML research, operations, data engineering, agent systems, and verifier engineering</title><defs>
<linearGradient id="ink"><stop stop-color="#fbfcff"/><stop offset=".52" stop-color="#bbc5ff"/><stop offset="1" stop-color="#79edee"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6aeef3"/><stop offset=".48" stop-color="#8b8dff"/><stop offset="1" stop-color="#d999ff"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#6044ce" stop-opacity=".38"/><stop offset="1" stop-color="#6044ce" stop-opacity="0"/></radialGradient>
<radialGradient id="cyanAura"><stop stop-color="#137f97" stop-opacity=".28"/><stop offset="1" stop-color="#137f97" stop-opacity="0"/></radialGradient>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171e35"/><stop offset="1" stop-color="#0d1221"/></linearGradient>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter>
<pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#99a9f0" opacity=".11"/></pattern>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#f1f5ff}
.mono{font-family:Consolas,'DejaVu Sans Mono',monospace}
.muted{fill:#9faec9}.cyan{fill:#62edee}.purple{fill:#a98aff}.lime{fill:#c5f784}
.dash{stroke-dasharray:5 10;animation:dash 24s linear infinite}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-180}}
@keyframes breathe{50%{opacity:.38}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
*{animation:none!important}</style><rect x="1" y="1" width="354" height="160" rx="14" fill="url(#surface)" stroke="#27324b" /><text x="21" y="32" font-size="14" class="mono" style="fill:#62edee">01</text><text x="21" y="73" font-size="26" class="" font-weight="650">Mathematics</text><text x="21" y="108" font-size="17" class="muted" >Proofs. Numerical reasoning.</text><text x="21" y="134" font-size="17" class="muted" >Exact, checkable certificates.</text><rect x="365" y="1" width="354" height="160" rx="14" fill="url(#surface)" stroke="#27324b" /><text x="385" y="32" font-size="14" class="mono" style="fill:#a98aff">02</text><text x="385" y="73" font-size="26" class="" font-weight="650">ML research</text><text x="385" y="108" font-size="17" class="muted" >Reproducible experiments.</text><text x="385" y="134" font-size="17" class="muted" >Model and trajectory analysis.</text><rect x="1" y="172" width="354" height="160" rx="14" fill="url(#surface)" stroke="#27324b" /><text x="21" y="203" font-size="14" class="mono" style="fill:#c5f784">03</text><text x="21" y="244" font-size="26" class="" font-weight="650">Operations</text><text x="21" y="279" font-size="17" class="muted" >Planning under constraints.</text><text x="21" y="305" font-size="17" class="muted" >Backlogs, staffing, allocation.</text><rect x="365" y="172" width="354" height="160" rx="14" fill="url(#surface)" stroke="#27324b" /><text x="385" y="203" font-size="14" class="mono" style="fill:#62edee">04</text><text x="385" y="244" font-size="26" class="" font-weight="650">Data engineering</text><text x="385" y="279" font-size="17" class="muted" >Reliable data and databases.</text><text x="385" y="305" font-size="17" class="muted" >Consistency &amp; reconciliation.</text><rect x="1" y="343" width="354" height="160" rx="14" fill="url(#surface)" stroke="#27324b" /><text x="21" y="374" font-size="14" class="mono" style="fill:#a98aff">05</text><text x="21" y="415" font-size="26" class="" font-weight="650">Agent systems</text><text x="21" y="450" font-size="17" class="muted" >Terminal execution &amp; tooling.</text><text x="21" y="476" font-size="17" class="muted" >Isolation and container runtimes.</text><rect x="365" y="343" width="354" height="160" rx="14" fill="url(#surface)" stroke="#27324b" /><text x="385" y="374" font-size="14" class="mono" style="fill:#c5f784">06</text><text x="385" y="415" font-size="26" class="" font-weight="650">Verifier engineering</text><text x="385" y="450" font-size="17" class="muted" >Oracle, no-op, mutation checks.</text><text x="385" y="476" font-size="17" class="muted" >Defensible scores and evidence.</text></svg>